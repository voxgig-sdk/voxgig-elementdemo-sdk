name: ci

# Unit tests only — strictly offline. No live API calls.
# Each per-language job runs the mocked unit-test suite for that target.
# Each step after checkout is gated by hashFiles() so a job auto-skips
# all its work when the target directory is absent.
#
# Live API verification is NOT run here. It happens in the central
# rebuild pipeline under controlled conditions, with per-API auth and
# rate-limit handling.
#
# ---------------------------------------------------------------------------
# COVERAGE TIERS — trimmed for this org
#
# The voxgig-sdk org allows only GitHub-authored actions (actions/*), and a
# workflow referencing any other action fails at STARTUP, before hashFiles()
# can skip a single job. The scaffold's jobs for rb, php, lua, scala, swift,
# dart, rust, zig, clojure, elixir, ocaml and haskell all need third-party
# setup actions, and none of those targets is generated in this repo, so
# those jobs are removed rather than rewritten.
#
# BLOCKING — a failure here fails the build.
#   go, ts, py (generated here), plus go-cli and go-mcp (auto-skip while
#   absent).
#
# PROJECT-SPECIFIC — this repo adds two more blocking jobs: `bash` (the
# custom target from the ext/ sdkgen package) and `app` (the companion
# reference server).
#
# ADVISORY — marked continue-on-error until each has a green run here;
# promote a job to blocking (drop continue-on-error) once it has passed.
#   js, csharp, java, kotlin, c, cpp, perl (all first-party-action only;
#   java is the one generated in this repo).
#
# Every target exposes `make -C <lang> test`, so the jobs differ only in
# toolchain setup.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('go/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - if: hashFiles('go/go.mod') != ''
        run: make -C go test

  go-cli:
    runs-on: ubuntu-latest
    # aql/eng/go is served via proxy.golang.org but its source repo
    # (aql-lang/aql) is currently private, so sum.golang.org can't
    # checksum-verify it. GOSUMDB=off lets `go mod tidy` use the
    # committed go.sum without re-checking the public sum DB. Once
    # aql-lang/aql goes public this env can be removed.
    env:
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('go-cli/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - if: hashFiles('go-cli/go.mod') != ''
        run: |
          cd go-cli
          go mod tidy
          go vet ./...
          go build ./...
          go test ./...

  go-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('go-mcp/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - if: hashFiles('go-mcp/go.mod') != ''
        run: |
          cd go-mcp
          go mod tidy
          go vet ./...
          go build ./...
          go test ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('ts/package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - if: hashFiles('ts/package.json') != ''
        run: cd ts && npm install --no-audit --no-fund
      # npm test runs the compiled dist-test/ suite, which is gitignored —
      # without a build first, node --test matches zero files and exits 0,
      # leaving CI green while testing nothing.
      - if: hashFiles('ts/package.json') != ''
        run: cd ts && npm run build
      - if: hashFiles('ts/package.json') != ''
        run: cd ts && npm test

  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('py/Makefile') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - if: hashFiles('py/Makefile') != ''
        run: pip install pytest
      - if: hashFiles('py/Makefile') != ''
        run: make -C py test

  # Project-specific target from the ext/ sdkgen package: the custom Bash
  # SDK. Fully offline; needs only bash, curl and jq, all preinstalled on
  # the runner.
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('bash/Makefile') != ''
        run: make -C bash test

  # The companion reference server (app/). Not an SDK target: a standalone
  # implementation of the API, used for local live validation of the SDKs.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('app/package.json') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - if: hashFiles('app/package.json') != ''
        run: cd app && npm install --no-audit --no-fund
      - if: hashFiles('app/package.json') != ''
        run: cd app && npm run typecheck
      - if: hashFiles('app/package.json') != ''
        run: cd app && npm test

  # ---- ADVISORY (see COVERAGE TIERS above) ---------------------------------

  js:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('js/Makefile') != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - if: hashFiles('js/package.json') != ''
        run: cd js && npm install --no-audit --no-fund
      - if: hashFiles('js/Makefile') != ''
        run: make -C js test

  csharp:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('csharp/Makefile') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - if: hashFiles('csharp/Makefile') != ''
        run: make -C csharp test

  java:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('java/Makefile') != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: hashFiles('java/Makefile') != ''
        run: make -C java test

  kotlin:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('kotlin/Makefile') != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: hashFiles('kotlin/Makefile') != ''
        run: make -C kotlin test

  c:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # gcc/make are preinstalled on ubuntu-latest — no setup step needed.
      - if: hashFiles('c/Makefile') != ''
        run: make -C c test

  cpp:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: hashFiles('cpp/Makefile') != ''
        run: make -C cpp test

  perl:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # perl is preinstalled on ubuntu-latest.
      - if: hashFiles('perl/Makefile') != ''
        run: make -C perl test
