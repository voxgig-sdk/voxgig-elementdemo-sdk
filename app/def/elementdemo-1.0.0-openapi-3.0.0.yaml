openapi: 3.0.0
info:
  title: Periodic Table API
  version: 1.0.0
  description: The Periodic Table API. Elements, isotopes, groups and series.

servers:
  - url: http://localhost:8902

paths:
  /api/element:
    get:
      summary: List elements
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Element'
    post:
      summary: Create element
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
  /api/element/{element_id}:
    get:
      summary: Get element
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
    put:
      summary: Update element
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Element'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Element'
    delete:
      summary: Delete element
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /api/element/{element_id}/ionize:
    post:
      summary: Ionize element
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                charge:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  ion:
                    type: string

  /api/element/{element_id}/isotope:
    get:
      summary: List isotopes of element
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Isotope'
    post:
      summary: Create isotope
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Isotope'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Isotope'
  /api/element/{element_id}/isotope/{isotope_id}:
    get:
      summary: Get isotope
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
        - name: isotope_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Isotope'
    put:
      summary: Update isotope
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
        - name: isotope_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Isotope'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Isotope'
    delete:
      summary: Delete isotope
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
        - name: isotope_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /api/element/{element_id}/isotope/{isotope_id}/decay:
    post:
      summary: Decay isotope
      parameters:
        - name: element_id
          in: path
          required: true
          schema:
            type: string
        - name: isotope_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                  product:
                    type: string

  /api/group:
    get:
      summary: List groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
  /api/group/{group_id}:
    get:
      summary: Get group
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /api/series:
    get:
      summary: List series
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
  /api/series/{series_id}:
    get:
      summary: Get series
      parameters:
        - name: series_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'

components:
  schemas:
    Element:
      type: object
      required:
        - id
        - name
        - symbol
        - number
        - period
        - block
        - series_id
        - mass
      properties:
        id:
          type: string
          description: Element identifier, the lowercase symbol.
        name:
          type: string
          description: Element name.
        symbol:
          type: string
          description: Chemical symbol.
        number:
          type: integer
          description: Atomic number.
        period:
          type: integer
          description: Periodic table row, 1 to 7.
        block:
          type: string
          description: Orbital block, one of s, p, d, f.
        series_id:
          type: string
          description: Chemical series this element belongs to.
        mass:
          type: number
          format: float
          description: Standard atomic weight in daltons.
        group:
          type: integer
          description: Periodic table column, 1 to 18, absent for the f-block.
        phase:
          type: string
          description: Phase at standard temperature and pressure.
        discovered:
          type: integer
          description: Year of discovery, absent for elements known since antiquity.
    Isotope:
      type: object
      required:
        - id
        - element_id
        - name
        - mass_number
        - mass
        - stable
      properties:
        id:
          type: string
          description: Isotope identifier, symbol dash mass number.
        element_id:
          type: string
          description: Parent element identifier.
        name:
          type: string
          description: Isotope name.
        mass_number:
          type: integer
          description: Total protons and neutrons.
        mass:
          type: number
          format: float
          description: Isotopic mass in daltons.
        stable:
          type: boolean
          description: True if the isotope is stable.
        abundance:
          type: number
          format: float
          description: Natural abundance as a fraction, absent for synthetic isotopes.
        halflife:
          type: string
          description: Half-life, absent for stable isotopes.
        mode:
          type: string
          description: Primary decay mode, absent for stable isotopes.
        product:
          type: string
          description: Primary decay product isotope, absent for stable isotopes.
    Group:
      type: object
      required:
        - id
        - number
        - cas
      properties:
        id:
          type: string
          description: Group identifier, g1 to g18.
        number:
          type: integer
          description: Group number, 1 to 18.
        cas:
          type: string
          description: CAS group designation.
        name:
          type: string
          description: Trivial name, where one exists.
    Series:
      type: object
      required:
        - id
        - name
        - color
        - description
      properties:
        id:
          type: string
          description: Series identifier.
        name:
          type: string
          description: Series name.
        color:
          type: string
          description: Display color used by the element card renderer.
        description:
          type: string
          description: One-line description of the series.
